<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活用 · Conjugación</title>
  <meta name="description" content="Práctica de conjugación de verbos japoneses hasta el N3, con traducción al español.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1><span lang="ja">活用</span> Conjugación</h1>
    <div class="stats" aria-live="polite">
      <span title="Racha actual">🔥 <b id="streak">0</b></span>
      <span title="Mejor racha">🏆 <b id="best">0</b></span>
      <span title="Aciertos en esta sesión"><b id="score">0/0</b></span>
      <a class="help" href="ayuda.html" title="Ayuda: qué respuesta se espera" aria-label="Ayuda">?</a>
    </div>
  </header>

  <main>
    <section class="card" id="card">
      <div class="meta" id="meta"></div>
      <div class="verb" id="verb" lang="ja"></div>
      <div class="meaning" id="meaning"></div>

      <div class="form" id="form"></div>
      <div class="gloss" id="gloss"></div>

      <form id="answer-form" autocomplete="off">
        <input id="answer" lang="ja" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Escribe en romaji o kana" aria-label="Respuesta">
        <div class="buttons">
          <button type="submit" id="submit">Comprobar</button>
          <button type="button" id="skip" class="ghost">No lo sé</button>
        </div>
      </form>
      <p class="hint">Enter para comprobar · Enter otra vez para seguir · <a href="ayuda.html">¿Qué tengo que escribir?</a></p>
    </section>

    <section class="feedback" id="feedback" hidden aria-live="polite"></section>

    <details class="panel" id="settings-panel">
      <summary>Ajustes</summary>
      <div id="settings"></div>
      <p class="count" id="pool-count"></p>
    </details>

    <details class="panel">
      <summary>Estadísticas por forma</summary>
      <div id="form-stats"></div>
      <button type="button" class="ghost small" id="reset-stats">Borrar estadísticas</button>
    </details>
  </main>

  <footer>
    <span id="verb-count"></span> verbos de mi lista de Notion ·
    <a href="https://github.com/angelengineer/japanese-web">código</a>
  </footer>

  <script src="js/vendor/wanakana.min.js"></script>
  <script src="data/verbs.js"></script>
  <script src="js/conjugate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
